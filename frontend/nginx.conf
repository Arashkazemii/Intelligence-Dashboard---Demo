server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Data planning, composition and one optional data supplement share a
        # bounded backend deadline. Keep the proxy above that request budget.
        proxy_read_timeout 125s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

