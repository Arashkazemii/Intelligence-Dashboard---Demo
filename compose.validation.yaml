services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dashboard_test
      POSTGRES_PASSWORD: ephemeral-test-only
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    network_mode: service:test-db
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://dashboard_test:ephemeral-test-only@127.0.0.1:5432/viradata_finance_test_a
      TEST_DATABASE_URL_SECONDARY: postgresql://dashboard_test:ephemeral-test-only@127.0.0.1:5432/viradata_finance_test_b
      TEST_API_DATABASE_URL: postgresql://dashboard_test:ephemeral-test-only@127.0.0.1:5432/viradata_finance_test_api
    command: ["python", "tests/run_postgres_suite.py"]
